[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-edu"
version = "0.1.0"
description = "Educational Python tools for learning gradient-based optimization."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "yiling1-bot" }
]
keywords = ["gradient-descent", "optimization", "education", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "numpy>=1.21"
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
test = ["pytest>=7"]

[project.scripts]
gradient-edu = "gradient_edu.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
